name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only release/X.Y.Z pull requests from scripts/release.mjs may change the version, so parallel branches never
      # collide on the same one.
      - name: Version changes only in release pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          node scripts/check-version.mjs FETCH_HEAD "$HEAD_REF"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bean-journal.reaplugin
          path: build/*.zip
